services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edgenode-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./lod_user:/app/lod_user:ro
      - ./2026-08-23_07-06-02_Base.db:/app/2026-08-23_07-06-02_Base.db:ro
      - ./2026-08-23_07-06-02_Base.db:/app/Base.db:ro
    environment:
      - DATA_DIR=/app/data
      - LOD_USER_DIR=/app/lod_user
      - FRONTEND_DIST=/app/frontend/dist
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edgenode-mesh

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edgenode-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - edgenode-mesh

networks:
  edgenode-mesh:
    driver: bridge
