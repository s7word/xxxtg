services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edgenode-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./lod_user:/app/lod_user
      - ./backend:/app/backend
    environment:
      - DATA_DIR=/app/data
      - DEVICE_DBS_DIR=/app/data/device_dbs
      - LOD_USER_DIR=/app/lod_user
      - FRONTEND_DIST=/app/frontend/dist
      - EDGENODE_AUTH_USER=${EDGENODE_AUTH_USER:-}
      - EDGENODE_AUTH_PASSWORD=${EDGENODE_AUTH_PASSWORD:-}
      - EDGENODE_AUTH_SECRET=${EDGENODE_AUTH_SECRET:-}
      - EDGENODE_AUTH_DISABLED=${EDGENODE_AUTH_DISABLED:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edgenode-mesh

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edgenode-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - edgenode-mesh

networks:
  edgenode-mesh:
    driver: bridge
